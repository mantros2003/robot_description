TrajectoryPlannerROS:
      # Base velocity limits
    max_vel_x: 0.5
    min_vel_x: 0.1
    max_vel_theta: 1.0
    min_in_place_vel_theta: 0.4

    # Acceleration limits (crucial for Gazebo physics)
    acc_lim_theta: 3.2
    acc_lim_x: 2.5
    acc_lim_y: 0.0

    # Tell it we are a differential drive robot!
    holonomic_robot: false

    # Goal tolerances
    yaw_goal_tolerance: 0.1
    xy_goal_tolerance: 0.15
 
    # Forward simulation (how far ahead it looks to calculate commands)
    sim_time: 1.5
    vx_samples: 6
    vtheta_samples: 20
